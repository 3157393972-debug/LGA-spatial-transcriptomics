name: Offline numerical checks
on:
  push:
    paths:
      - 'lga/**'
      - 'experiments/**'
      - 'src/**'
      - 'scripts/**'
      - 'tests/**'
      - 'results/**'
      - '.github/workflows/offline-checks.yml'
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  numerical-consistency:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: Install offline scientific dependencies
        run: python -m pip install numpy scipy scikit-learn
      - name: Validate syntax
        run: python -m compileall -q lga src scripts tests
      - name: Run minimal LGA example
        run: python examples/basic_usage.py
      - name: Verify input manifest metadata
        run: python scripts/verify_input_manifest.py --metadata-only --data-root .
      - name: Verify archived aggregates
        run: python scripts/verify_aggregates.py
      - name: Run numerical regression tests
        run: python -m unittest discover -s tests -v
