name: Core and numerical consistency checks

on:
  push:
    paths:
      - 'lga/**'
      - 'experiments/**'
      - 'src/**'
      - 'scripts/**'
      - 'tests/**'
      - 'results/**'
      - '.github/workflows/offline-checks.yml'
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-aggregates-and-figures:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: Install core numerical test dependencies
        run: python -m pip install numpy scipy scikit-learn
      - name: Validate Python syntax
        run: python -m compileall -q src scripts tests
      - name: Verify archived aggregates
        run: python scripts/verify_aggregates.py
      - name: Run offline regression tests
        run: python -m unittest discover -s tests -v
