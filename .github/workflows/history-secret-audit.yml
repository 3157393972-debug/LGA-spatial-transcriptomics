name: Pre-publication Git-history credential audit

on:
  push:
    branches:
      - audit/history-security-20261017
  workflow_dispatch:

permissions:
  contents: read

jobs:
  git-history-security:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Analyze all reachable blob objects without printing secret values
        shell: bash
        run: |
          python - <<'PY'
          import re, subprocess, collections, pathlib, sys
          listing=subprocess.check_output(['git','rev-list','--objects','--all'],text=True).splitlines()
          names={}
          for row in listing:
              oid,_,path=row.partition(' ')
              if path: names.setdefault(oid,set()).add(path)
          bad_suffix=re.compile(r'(^|/)(?:\.env(?:\..+)?|id_(?:rsa|ed25519)|[^/]+\.(?:pem|p12|pfx|key|h5ad|npz|pth|pt))$',re.I)
          rules={
           'private_key_block':re.compile(rb'-----BEGIN (?:RSA |OPENSSH |EC |DSA |PGP )?PRIVATE KEY-----'),
           'github_token':re.compile(rb'gh[pousr]_[A-Za-z0-9_]{20,}'),
           'github_fine_grained_token':re.compile(rb'github_pat_[A-Za-z0-9_]{20,}'),
           'cloud_access_key':re.compile(rb'AKIA[0-9A-Z]{16}'),
           'password_assignment':re.compile(rb'(?im)^\s*(?:export\s+)?(?:password|passwd|ssh_password|api_token|access_token|secret_key|api_key)\s*[:=]\s*[\x27\x22]?[^\x27\x22\s#]{8,}'),
          }
          git_objects=[]; reported=[];text_count=0; history_path_hits=[]
          for oid,paths in names.items():
              typ=subprocess.check_output(['git','cat-file','-t',oid],text=True).strip()
              if typ!='blob': continue
              git_objects.append(oid)
              if any(bad_suffix.search(path) for path in paths):
                  history_path_hits.append(tuple(sorted(paths))[:3])
              size=int(subprocess.check_output(['git','cat-file','-s',oid],text=True))
              if size>2_000_000:continue
              raw=subprocess.check_output(['git','cat-file','blob',oid]);text_count+=1
              for rule,rx in rules.items():
                  if rx.search(raw):
                      reported.append((rule,tuple(sorted(paths))[:3]))
          print('History blobs checked:',len(git_objects),'text/content blobs scanned:',text_count)
          print('Historical sensitive file names:',len(history_path_hits))
          print('Credential-like content findings:',len(reported))
          for paths in history_path_hits[:30]: print('SUSPECT FILE PATH:', ' | '.join(paths))
          for rule,paths in reported[:30]: print('SUSPECT PATTERN:',rule,'FILE:',' | '.join(paths))
          if history_path_hits or reported:
              raise SystemExit('Potential disclosures found; manual review required')
          print('PASS: no matches to defined sensitive filename/content patterns')
          PY
