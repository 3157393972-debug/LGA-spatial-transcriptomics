name: Pre-publication Git-history secret scan

on:
  push:
    branches:
      - audit/history-security-20261017
  workflow_dispatch:

permissions:
  contents: read

jobs:
  gitleaks-history:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install Gitleaks
        run: |
          curl -fsSL --retry 3 \
            https://github.com/gitleaks/gitleaks/releases/download/v8.30.0/gitleaks_8.30.0_linux_x64.tar.gz \
            -o /tmp/gitleaks.tgz
          tar -xz -C /tmp gitleaks
          /tmp/gitleaks version
      - name: Scan all reachable Git history without revealing matches
        shell: bash
        run: |
          set +e
          /tmp/gitleaks git --redact --log-opts="--all" \
            --report-format=json --report-path=/tmp/lga-gitleaks-report.json . \
            >/tmp/gitleaks-run.log 2>&1
          status=$?
          set -e
          python - <<'PY'
          import json, pathlib
          p=pathlib.Path('/tmp/lga-gitleaks-report.json')
          entries=json.loads(p.read_text()) if p.exists() and p.stat().st_size else []
          from collections import Counter
          kinds=Counter(e.get('RuleID','unknown') for e in entries)
          print('Gitleaks findings:',len(entries))
          print('Rules:',dict(kinds))
          print('Locations:',sorted(set(e.get('File','unknown') for e in entries)))
          PY
          if [ "$status" -ne 0 ]; then
            echo "::error::Potential secrets require manual resolution before public release."
            exit 1
          fi
          echo "Gitleaks all-history scan passed"
